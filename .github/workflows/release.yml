# Build OX Link from a version tag on GitHub's macOS runner and publish it as a release.
# Push a tag to release: git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat RELEASE_NOTES.md
            echo
            echo '### SHA-256'
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "OX Link ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
